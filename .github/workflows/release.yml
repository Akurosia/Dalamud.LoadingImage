name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      DALAMUD_HOME: /tmp/dalamud
      IsCI: true
      PROJECT_PATH: Dalamud.LoadingImage/Dalamud.LoadingImage.csproj
      MANIFEST_NAME: Dalamud.LoadingImage.json
      INTERNAL_NAME: Dalamud.LoadingImage

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        run: |
          mkdir -p "$DALAMUD_HOME"
          curl -L https://goatcorp.github.io/dalamud-distrib/latest.zip -o /tmp/dalamud.zip
          unzip -q /tmp/dalamud.zip -d "$DALAMUD_HOME"

      - name: Restore
        run: dotnet restore "$PROJECT_PATH"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            raw_version="${GITHUB_REF_NAME#v}"
          else
            raw_version="$(grep -oPm1 '(?<=<AssemblyVersion>)[^<]+' "$PROJECT_PATH")"
          fi

          if [[ ! "$raw_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Version must be in 0.0.0 or 0.0.0.0 format: $raw_version" >&2
            exit 1
          fi

          IFS='.' read -ra version_parts <<< "$raw_version"
          while [[ "${#version_parts[@]}" -lt 4 ]]; do
            version_parts+=("0")
          done

          assembly_version="${version_parts[0]}.${version_parts[1]}.${version_parts[2]}.${version_parts[3]}"
          package_version="${version_parts[0]}.${version_parts[1]}.${version_parts[2]}"

          echo "assembly_version=$assembly_version" >> "$GITHUB_OUTPUT"
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"
          echo "Resolved package version: $package_version"
          echo "Resolved assembly version: $assembly_version"

      - name: Build
        run: |
          dotnet build "$PROJECT_PATH" \
            -c Release \
            -p:Platform=x64 \
            --no-restore \
            --nologo \
            -p:Version=${{ steps.version.outputs.package_version }} \
            -p:AssemblyVersion=${{ steps.version.outputs.assembly_version }} \
            -p:FileVersion=${{ steps.version.outputs.assembly_version }}

      - name: Collect and validate package
        id: package
        shell: bash
        run: |
          set -euo pipefail

          package_path="$(find Dalamud.LoadingImage/bin -path '*/Release/*/latest.zip' -type f | head -n 1)"
          if [[ -z "${package_path}" ]]; then
            echo "Could not find latest.zip under Dalamud.LoadingImage/bin"
            find Dalamud.LoadingImage/bin -maxdepth 6 -type f -print
            exit 1
          fi

          mkdir -p artifacts
          cp "$package_path" artifacts/latest.zip
          sha512sum artifacts/latest.zip > artifacts/checksums.sha512
          unzip -l artifacts/latest.zip

          manifest_json="$(unzip -p artifacts/latest.zip "$MANIFEST_NAME")"
          packaged_version="$(jq -r '.AssemblyVersion' <<< "$manifest_json")"
          packaged_internal_name="$(jq -r '.InternalName' <<< "$manifest_json")"
          packaged_repo_url="$(jq -r '.RepoUrl' <<< "$manifest_json")"
          expected_repo_name="${GITHUB_REPOSITORY#*/}"
          expected_repo_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"

          if [[ "$packaged_version" != "${{ steps.version.outputs.assembly_version }}" ]]; then
            echo "Packaged version $packaged_version does not match tag-derived version ${{ steps.version.outputs.assembly_version }}" >&2
            exit 1
          fi

          if [[ "$packaged_internal_name" != "$INTERNAL_NAME" || "$packaged_internal_name" != "$expected_repo_name" ]]; then
            echo "Packaged InternalName $packaged_internal_name does not match expected name $INTERNAL_NAME / repo $expected_repo_name" >&2
            exit 1
          fi

          if [[ "$packaged_repo_url" != "$expected_repo_url" ]]; then
            echo "Packaged RepoUrl $packaged_repo_url does not match repository URL $expected_repo_url" >&2
            exit 1
          fi

          echo "Packaged plugin version: $packaged_version"
          echo "Packaged plugin name: $packaged_internal_name"
          echo "Packaged repo URL: $packaged_repo_url"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.INTERNAL_NAME }}-${{ steps.version.outputs.assembly_version }}
          path: |
            artifacts/latest.zip
            artifacts/checksums.sha512
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/latest.zip
            artifacts/checksums.sha512
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Update repo.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail

          release_version="${{ steps.version.outputs.assembly_version }}"
          download_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/latest.zip"
          repo_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"

          jq \
            --arg release_version "$release_version" \
            --arg download_url "$download_url" \
            --arg repo_url "$repo_url" \
            --arg internal_name "$INTERNAL_NAME" \
            '.[0].InternalName = $internal_name |
             .[0].AssemblyVersion = $release_version |
             .[0].TestingAssemblyVersion = $release_version |
             .[0].RepoUrl = $repo_url |
             .[0].DownloadLinkInstall = $download_url |
             .[0].DownloadLinkUpdate = $download_url |
             .[0].DownloadLinkTesting = $download_url' \
            repo.json > repo.tmp.json

          mv repo.tmp.json repo.json
          cat repo.json

          repo_internal_name="$(jq -r '.[0].InternalName' repo.json)"
          repo_version="$(jq -r '.[0].AssemblyVersion' repo.json)"
          repo_testing_version="$(jq -r '.[0].TestingAssemblyVersion' repo.json)"
          repo_download="$(jq -r '.[0].DownloadLinkInstall' repo.json)"

          if [[ "$repo_internal_name" != "$INTERNAL_NAME" ]]; then
            echo "repo.json InternalName $repo_internal_name does not match $INTERNAL_NAME" >&2
            exit 1
          fi

          if [[ "$repo_version" != "$release_version" || "$repo_testing_version" != "$release_version" ]]; then
            echo "repo.json versions do not match $release_version" >&2
            exit 1
          fi

          if [[ "$repo_download" != "$download_url" ]]; then
            echo "repo.json download URL does not match $download_url" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo.json

          if git diff --cached --quiet; then
            echo "repo.json already up to date"
            exit 0
          fi

          git commit -m "Update repo.json for ${GITHUB_REF_NAME}"
          git push origin HEAD:master
